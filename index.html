<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Dünyam | v1.0.6</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #0a0a12; --blue: #16213e; --accent: #e94560; --green: #00ff41; --text: #e2e2e2; }
        body { font-family: 'Consolas', monospace; margin: 0; background-color: var(--dark); color: var(--text); overflow-x: hidden; }
        
        /* Navigasyon */
        header { background: #1a1a2e; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
        .version-group { display: flex; align-items: center; background: var(--accent); padding: 2px 10px; border-radius: 15px; cursor: pointer; }

        /* Oyun Seçme Üst Menü */
        .game-nav { display: flex; justify-content: center; gap: 10px; background: #16213e; padding: 10px; }
        .game-nav-btn { background: var(--dark); border: 1px solid var(--accent); color: white; padding: 8px 20px; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        .game-nav-btn:hover, .game-nav-btn.active { background: var(--accent); }

        .container { display: flex; flex-direction: column; align-items: center; min-height: 80vh; padding-top: 20px; }

        /* ANA MENÜ (Ayarlar - Oyna - Karakter) */
        .game-main-menu { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 50px; }
        .menu-btn { 
            width: 150px; height: 150px; background: var(--blue); border: 2px solid var(--accent); 
            border-radius: 15px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.3s;
        }
        .menu-btn:hover { transform: translateY(-5px); box-shadow: 0 5px 15px var(--accent); }
        .menu-btn i { font-size: 2.5rem; margin-bottom: 10px; }

        /* Oyun Alanı */
        #game-area { display: none; flex-direction: column; align-items: center; margin-top: 20px; }
        canvas { border: 4px solid #333; background: #000; }
        .hud { display: flex; justify-content: space-between; width: 400px; margin-bottom: 10px; color: var(--green); font-weight: bold; }

        .hidden { display: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

<header>
    <div onclick="showHome()" style="cursor:pointer;"><i class="fas fa-dragon"></i> BENİM DÜNYAM</div>
    <div class="version-group" onclick="alert('v1.0.6: WASD eklendi, 3 oyun geri geldi, hız dengelendi.')">
        <span class="version">v1.0.6</span> <i class="fas fa-info-circle"></i>
    </div>
</header>

<div id="game-selector" class="game-nav hidden">
    <button class="game-nav-btn" id="btn-snake" onclick="selectGame('snake')">YILAN</button>
    <button class="game-nav-btn" id="btn-tetris" onclick="selectGame('tetris')">TETRİS</button>
    <button class="game-nav-btn" id="btn-pacman" onclick="selectGame('pacman')">PACMAN</button>
</div>

<div class="container" id="main-ui">
    <div id="home-buttons" class="game-main-menu">
        <div class="menu-btn" onclick="showSection('games')"><i class="fas fa-gamepad"></i><span>OYUNLAR</span></div>
        <div class="menu-btn" onclick="alert('Notlar yakında')"><i class="fas fa-book"></i><span>NOTLAR</span></div>
        <div class="menu-btn" onclick="alert('Filmler yakında')"><i class="fas fa-film"></i><span>FİLMLER</span></div>
    </div>

    <div id="game-sub-menu" class="game-main-menu hidden">
        <div class="menu-btn" onclick="openSettings()"><i class="fas fa-cog"></i><span>AYARLAR</span></div>
        <div class="menu-btn" id="play-btn" style="background: var(--accent);"><i class="fas fa-play"></i><span>OYNA</span></div>
        <div class="menu-btn" onclick="openSkins()"><i class="fas fa-user-ninja"></i><span>KARAKTER</span></div>
    </div>

    <div id="game-area">
        <div class="hud">
            <span id="stat-level">Dünya: 1-1</span>
            <span id="stat-score">Puan: 0</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <p style="color: #666; margin-top: 10px;">WASD/Ok Tuşları | Shift: Hızlan</p>
    </div>
</div>

<div id="game-over" class="overlay">
    <h1 style="color: var(--accent);">ÖLDÜN!</h1>
    <button class="game-nav-btn" onclick="resetGame()">TEKRAR DENE</button>
</div>

<script>
    let activeGame = 'snake';
    let gameLoop;
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Yılan Değişkenleri
    let box = 20;
    let snake, food, dir, score, currentSpeed;
    let baseSpeed = 120;
    let shiftSpeed = 50;

    function showHome() {
        location.reload();
    }

    function showSection(sec) {
        document.getElementById('home-buttons').classList.add('hidden');
        if(sec === 'games') {
            document.getElementById('game-selector').classList.remove('hidden');
            selectGame('snake'); // Default yılan başlasın
        }
    }

    function selectGame(game) {
        activeGame = game;
        clearInterval(gameLoop);
        document.getElementById('game-area').style.display = 'none';
        document.getElementById('game-sub-menu').classList.remove('hidden');
        
        // Buton aktifliği
        document.querySelectorAll('.game-nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + game).classList.add('active');

        // Oyna butonuna o oyunun fonksiyonunu ata
        document.getElementById('play-btn').onclick = () => {
            if(game === 'snake') startSnake();
            else alert(game + " çok yakında!");
        };
    }

    function startSnake() {
        document.getElementById('game-sub-menu').classList.add('hidden');
        document.getElementById('game-area').style.display = 'flex';
        
        snake = [{ x: 10 * box, y: 10 * box }];
        food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
        dir = "";
        score = 0;
        currentSpeed = baseSpeed;
        
        if(gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(drawSnake, currentSpeed);
    }

    // KONTROLLER (WASD + OKLAR + SHIFT)
    document.addEventListener("keydown", e => {
        let key = e.key.toLowerCase();
        if(e.code === "ShiftLeft") updateSpeed(shiftSpeed);
        
        if((key == "a" || e.keyCode == 37) && dir != "RIGHT") dir = "LEFT";
        if((key == "w" || e.keyCode == 38) && dir != "DOWN") dir = "UP";
        if((key == "d" || e.keyCode == 39) && dir != "LEFT") dir = "RIGHT";
        if((key == "s" || e.keyCode == 40) && dir != "UP") dir = "DOWN";
    });

    document.addEventListener("keyup", e => {
        if(e.code === "ShiftLeft") updateSpeed(baseSpeed);
    });

    function updateSpeed(newSpeed) {
        currentSpeed = newSpeed;
        if(gameLoop) {
            clearInterval(gameLoop);
            gameLoop = setInterval(drawSnake, currentSpeed);
        }
    }

    function drawSnake() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? varColor() : "white";
            ctx.fillRect(snake[i].x, snake[i].y, box-1, box-1);
        }

        ctx.fillStyle = "red";
        ctx.fillRect(food.x, food.y, box-1, box-1);

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if (dir == "LEFT") snakeX -= box;
        if (dir == "UP") snakeY -= box;
        if (dir == "RIGHT") snakeX += box;
        if (dir == "DOWN") snakeY += box;

        // DUVAR ÖLÜMÜ
        if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height) {
            gameOver(); return;
        }

        let newHead = { x: snakeX, y: snakeY };

        // KENDİNE ÇARPMA
        for(let i=0; i<snake.length; i++){
            if(newHead.x == snake[i].x && newHead.y == snake[i].y) { gameOver(); return; }
        }

        if (snakeX == food.x && snakeY == food.y) {
            score++;
            document.getElementById("stat-score").innerText = "Puan: " + score;
            food = { x: Math.floor(Math.random() * 19) * box, y: Math.floor(Math.random() * 19) * box };
        } else {
            snake.pop();
        }
        snake.unshift(newHead);
    }

    function gameOver() {
        clearInterval(gameLoop);
        document.getElementById("game-over").style.display = "flex";
    }

    function resetGame() {
        document.getElementById("game-over").style.display = "none";
        startSnake();
    }

    function varColor() { return "#00ff41"; }
    function openSettings() { alert("Ses ve Zorluk Ayarları"); }
    function openSkins() { alert("Karakter Seçimi"); }
</script>
</body>
</html>
