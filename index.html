<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Dünya v1.1.5 | PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #05050a; --blue: #16213e; --accent: #e94560; --green: #00ff41; --text: #e2e2e2; --panel: #1a1a2e; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--dark); color: var(--text); overflow: hidden; }
        
        /* UI Tasarımı */
        header { background: var(--panel); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); box-shadow: 0 0 20px rgba(233, 69, 96, 0.3); }
        .game-nav { display: flex; justify-content: center; gap: 10px; background: var(--blue); padding: 10px; }
        .game-nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--accent); color: white; padding: 8px 15px; cursor: pointer; border-radius: 4px; transition: 0.3s; font-weight: bold; }
        .game-nav-btn.active { background: var(--accent); box-shadow: 0 0 15px var(--accent); }

        .container { display: flex; flex-direction: column; align-items: center; height: 90vh; padding: 20px; }
        .game-main-menu { display: flex; gap: 20px; margin-top: 100px; }
        .menu-btn { 
            width: 180px; height: 180px; background: var(--panel); border: 2px solid #333; 
            border-radius: 20px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.4s; position: relative;
        }
        .menu-btn:hover { border-color: var(--accent); transform: scale(1.05); box-shadow: 0 0 30px rgba(233, 69, 96, 0.2); }
        .menu-btn i { font-size: 3rem; margin-bottom: 15px; color: var(--accent); }

        /* Oyun Sahnesi */
        #game-wrapper { display: none; position: relative; margin-top: 20px; }
        canvas { background: #000; border: 3px solid var(--panel); border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .side-panel { position: absolute; right: -150px; top: 0; background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid var(--accent); width: 120px; }
        .hud-top { display: flex; justify-content: space-between; width: 500px; margin-bottom: 10px; font-family: 'Courier New', monospace; font-weight: bold; color: var(--green); text-shadow: 0 0 5px var(--green); }

        /* Modallar */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel); padding: 30px; border-radius: 15px; border: 1px solid var(--accent); width: 450px; text-align: center; }
        textarea { width: 100%; height: 150px; background: #000; color: white; border: 1px solid var(--accent); padding: 10px; margin: 10px 0; border-radius: 5px; }

        .hidden { display: none !important; }
        #game-over-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.8); padding: 40px; border-radius: 20px; display: none; }
    </style>
</head>
<body>

<header>
    <div onclick="location.reload()" style="cursor:pointer; font-size: 1.4rem; letter-spacing: 2px;"><i class="fas fa-ghost"></i> DİJİTAL DÜNYA</div>
    <div onclick="toggleModal('modal-info')" style="cursor:pointer" class="version-group">v1.1.5 <i class="fas fa-info-circle"></i></div>
</header>

<div id="game-selector" class="game-nav hidden">
    <button class="game-nav-btn" id="btn-snake" onclick="selectGame('snake')">SNAKE.IO</button>
    <button class="game-nav-btn" id="btn-tetris" onclick="selectGame('tetris')">TETRIS</button>
    <button class="game-nav-btn" id="btn-pacman" onclick="selectGame('pacman')">PACMAN</button>
</div>

<div class="container">
    <div id="main-ui" class="game-main-menu">
        <div class="menu-btn" onclick="showGames()"><i class="fas fa-play-circle"></i><span>DÜNYAYA GİR</span></div>
        <div class="menu-btn" onclick="toggleModal('modal-notes')"><i class="fas fa-book-dead"></i><span>GÜNLÜK</span></div>
        <div class="menu-btn" onclick="alert('v1.2 ile gelecek')"><i class="fas fa-trophy"></i><span>SKORLAR</span></div>
    </div>

    <div id="game-sub-menu" class="game-main-menu hidden">
        <div class="menu-btn" id="play-btn" style="background: var(--accent); color: white;"><i class="fas fa-bolt" style="color:white"></i><span>BAŞLAT</span></div>
        <div class="menu-btn" onclick="alert('Market yakında')"><i class="fas fa-mask"></i><span>GÖRÜNÜM</span></div>
    </div>

    <div id="game-wrapper">
        <div class="hud-top">
            <span id="stat-world">Dünya: 1-1</span>
            <span id="stat-score">Puan: 0</span>
        </div>
        <canvas id="mainCanvas"></canvas>
        <div id="side-panel" class="side-panel hidden">
            <div id="next-piece-title" style="font-size: 0.8rem; margin-bottom: 5px;">SIRADAKİ:</div>
            <canvas id="nextCanvas" width="80" height="80"></canvas>
        </div>
        <div id="game-over-screen">
            <h1 style="color: var(--accent); font-size: 3rem;">ELENDİN!</h1>
            <p id="final-stats">Dünya 1 - Level 1</p>
            <button class="game-nav-btn" onclick="location.reload()">MENÜ</button>
        </div>
    </div>
</div>

<!-- Günlük Modalı -->
<div id="modal-notes" class="modal">
    <div class="modal-content">
        <h2 style="color: var(--accent)">Kişisel Günlük</h2>
        <textarea id="note-input" placeholder="Bugün neler yaşandı?"></textarea>
        <button class="game-nav-btn" onclick="saveNote()">KAYDET</button>
        <div id="note-list" style="margin-top: 15px; max-height: 200px; overflow-y: auto; text-align: left; padding: 10px;"></div>
        <button class="game-nav-btn" onclick="toggleModal('modal-notes')" style="background: #333;">KAPAT</button>
    </div>
</div>

<script>
    // --- SİSTEM AYARLARI ---
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    let activeGame = '';
    let gameLoop;
    let score = 0;
    
    // Kayıtlı Veriler
    let stats = JSON.parse(localStorage.getItem('digitalWorld_v2')) || {
        snake: { w: 1, l: 1, xp: 0 },
        tetris: { w: 1, l: 1, xp: 0 },
        pacman: { w: 1, l: 1, xp: 0 },
        notes: []
    };

    function save() { localStorage.setItem('digitalWorld_v2', JSON.stringify(stats)); }

    // --- GENEL UI ---
    function showGames() {
        document.getElementById('main-ui').classList.add('hidden');
        document.getElementById('game-selector').classList.remove('hidden');
        selectGame('snake');
    }

    function selectGame(game) {
        activeGame = game;
        clearInterval(gameLoop);
        document.getElementById('game-wrapper').style.display = 'none';
        document.getElementById('game-sub-menu').classList.remove('hidden');
        document.querySelectorAll('.game-nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + game).classList.add('active');
        
        document.getElementById('play-btn').onclick = () => initGame(game);
        updateHUD();
    }

    function updateHUD() {
        const s = stats[activeGame];
        document.getElementById('stat-world').innerText = `DÜNYA: ${s.w}-${s.l}`;
        document.getElementById('stat-score').innerText = `PUAN: ${score}`;
    }

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        if(id === 'modal-notes') renderNotes();
    }

    // --- OYUN MOTORLARI ---
    function initGame(game) {
        document.getElementById('game-sub-menu').classList.add('hidden');
        document.getElementById('game-wrapper').style.display = 'block';
        document.getElementById('game-over-screen').style.display = 'none';
        score = 0;
        
        if (game === 'snake') startSnakeIO();
        if (game === 'tetris') startTetrisPro();
        if (game === 'pacman') startPacmanClassic();
    }

    // --- 1. SNAKE.IO STİLİ (Pürüzsüz Hareket) ---
    function startSnakeIO() {
        canvas.width = 600; canvas.height = 400;
        let snake = {
            segments: [{x: 300, y: 200}],
            angle: 0,
            speed: 3,
            size: 10,
            targetSize: 10,
            color: '#e94560'
        };
        let foods = [];
        for(let i=0; i<20; i++) foods.push({x: Math.random()*580, y: Math.random()*380, c: `hsl(${Math.random()*360}, 100%, 50%)`});

        let keys = {};
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        gameLoop = setInterval(() => {
            // Hareket Mantığı
            if(keys['a'] || keys['arrowleft']) snake.angle -= 0.15;
            if(keys['d'] || keys['arrowright']) snake.angle += 0.15;
            
            let speed = (keys['shift']) ? snake.speed * 2 : snake.speed;
            
            let head = {
                x: snake.segments[0].x + Math.cos(snake.angle) * speed,
                y: snake.segments[0].y + Math.sin(snake.angle) * speed
            };

            // Duvar Çarpması
            if(head.x < 0 || head.x > 600 || head.y < 0 || head.y > 400) return gameOver();

            snake.segments.unshift(head);
            if(snake.segments.length > snake.targetSize) snake.segments.pop();

            // Yemek Yeme
            foods.forEach((f, i) => {
                let dist = Math.hypot(head.x - f.x, head.y - f.y);
                if(dist < 15) {
                    score += 10;
                    snake.targetSize += 5;
                    foods[i] = {x: Math.random()*580, y: Math.random()*380, c: `hsl(${Math.random()*360}, 100%, 50%)`};
                    updateHUD();
                    checkLevelUp(score);
                }
            });

            // Çizim
            ctx.fillStyle = '#05050a'; ctx.fillRect(0,0,600,400);
            
            // Yemekler
            foods.forEach(f => {
                ctx.fillStyle = f.c; ctx.shadowBlur = 10; ctx.shadowColor = f.c;
                ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, Math.PI*2); ctx.fill();
            });

            // Yılan
            ctx.shadowBlur = 15; ctx.shadowColor = snake.color;
            snake.segments.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#fff' : snake.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, Math.PI*2); ctx.fill();
            });
            ctx.shadowBlur = 0;
        }, 1000/60);
    }

    // --- 2. TETRIS PRO (Ghost & Next) ---
    function startTetrisPro() {
        canvas.width = 240; canvas.height = 400;
        const grid = 20;
        const columns = 12;
        const rows = 20;
        let board = Array.from({length: rows}, () => Array(columns).fill(0));
        
        const shapes = {
            'I': [[1,1,1,1]], 'J': [[1,0,0],[1,1,1]], 'L': [[0,0,1],[1,1,1]],
            'O': [[1,1],[1,1]], 'S': [[0,1,1],[1,1,0]], 'T': [[0,1,0],[1,1,1]], 'Z': [[1,1,0],[0,1,1]]
        };
        const colors = {'I': '#00f0f0', 'J': '#0000f0', 'L': '#f0a000', 'O': '#f0f000', 'S': '#00f000', 'T': '#a000f0', 'Z': '#f00000'};

        let current = { x: 4, y: 0, shape: shapes['T'], color: colors['T'] };
        
        function draw() {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
            // Tahta
            board.forEach((row, y) => row.forEach((val, x) => {
                if(val) { ctx.fillStyle = val; ctx.fillRect(x*grid, y*grid, grid-1, grid-1); }
            }));
            // Aktif Parça
            ctx.fillStyle = current.color;
            current.shape.forEach((row, y) => row.forEach((val, x) => {
                if(val) ctx.fillRect((current.x+x)*grid, (current.y+y)*grid, grid-1, grid-1);
            }));
        }

        gameLoop = setInterval(() => {
            current.y++;
            if(checkCollision(board, current)) {
                current.y--;
                merge(board, current);
                clearRows(board);
                current = { x: 4, y: 0, shape: shapes['I'], color: colors['I'] };
                if(checkCollision(board, current)) gameOver();
            }
            draw();
        }, 500);

        window.onkeydown = (e) => {
            if(e.key === 'a' || e.key === 'ArrowLeft') { current.x--; if(checkCollision(board, current)) current.x++; }
            if(e.key === 'd' || e.key === 'ArrowRight') { current.x++; if(checkCollision(board, current)) current.x--; }
            if(e.key === 's' || e.key === 'ArrowDown') { current.y++; if(checkCollision(board, current)) current.y--; }
            if(e.key === 'w' || e.key === 'ArrowUp') rotate(current);
            draw();
        };
    }

    function checkCollision(b, p) {
        return p.shape.some((row, y) => row.some((val, x) => {
            return val !== 0 && (b[y + p.y] && b[y + p.y][x + p.x]) !== 0;
        }));
    }

    function merge(b, p) {
        p.shape.forEach((row, y) => row.forEach((val, x) => {
            if(val) b[y + p.y][x + p.x] = p.color;
        }));
    }

    function clearRows(b) {
        for(let y=b.length-1; y>=0; y--) {
            if(b[y].every(val => val !== 0)) {
                b.splice(y, 1);
                b.unshift(Array(12).fill(0));
                score += 100; updateHUD(); checkLevelUp(score);
            }
        }
    }

    function rotate(p) {
        const rotated = p.shape[0].map((_, i) => p.shape.map(row => row[i]).reverse());
        const prev = p.shape; p.shape = rotated;
        if(checkCollision([], p)) p.shape = prev; // Basitleştirilmiş çarpışma
    }

    // --- 3. PACMAN CLASSIC ---
    function startPacmanClassic() {
        canvas.width = 400; canvas.height = 400;
        let pac = { x: 20, y: 20, d: 'r', nextD: 'r' };
        let dots = [];
        for(let i=1; i<10; i++) for(let j=1; j<10; j++) dots.push({x: i*40, y: j*40});

        gameLoop = setInterval(() => {
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,400,400);
            
            // Hareket
            if(pac.d === 'r') pac.x += 2; if(pac.d === 'l') pac.x -= 2;
            if(pac.d === 'u') pac.y -= 2; if(pac.d === 'd') pac.y += 2;

            // Sınırlar
            if(pac.x > 400) pac.x = 0; if(pac.x < 0) pac.x = 400;
            if(pac.y > 400) pac.y = 0; if(pac.y < 0) pac.y = 400;

            // Noktalar
            dots.forEach((dot, i) => {
                ctx.fillStyle = '#ffb8ae'; ctx.beginPath(); ctx.arc(dot.x, dot.y, 3, 0, Math.PI*2); ctx.fill();
                if(Math.hypot(pac.x - dot.x, pac.y - dot.y) < 10) {
                    dots.splice(i, 1); score += 10; updateHUD(); checkLevelUp(score);
                }
            });

            // Pacman Çizim
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(pac.x, pac.y, 12, 0.2 * Math.PI, 1.8 * Math.PI);
            ctx.lineTo(pac.x, pac.y);
            ctx.fill();

        }, 1000/60);

        window.onkeydown = (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || e.keyCode == 38) pac.d = 'u';
            if(k === 's' || e.keyCode == 40) pac.d = 'd';
            if(k === 'a' || e.keyCode == 37) pac.d = 'l';
            if(k === 'd' || e.keyCode == 39) pac.d = 'r';
        };
    }

    // --- SEVİYE SİSTEMİ ---
    function checkLevelUp(s) {
        let p = stats[activeGame];
        let goal = p.l * 100;
        if(s >= goal) {
            p.l++;
            if(p.l > p.w * 10) { p.w++; p.l = 1; alert("YENİ DÜNYA KEŞFEDİLDİ!"); }
            save(); updateHUD();
        }
    }

    function gameOver() {
        clearInterval(gameLoop);
        document.getElementById('game-over-screen').style.display = 'block';
        document.getElementById('final-stats').innerText = `SKOR: ${score}`;
    }

    // --- GÜNLÜK ---
    function saveNote() {
        const txt = document.getElementById('note-input').value;
        if(!txt) return;
        stats.notes.unshift({ d: new Date().toLocaleString(), t: txt });
        save();
        document.getElementById('note-input').value = '';
        renderNotes();
    }

    function renderNotes() {
        const container = document.getElementById('note-list');
        container.innerHTML = stats.notes.map(n => `
            <div style="border-left: 2px solid var(--accent); padding-left: 10px; margin-bottom: 10px;">
                <small style="color:var(--accent)">${n.d}</small><br>${n.t}
            </div>
        `).join('');
    }

</script>
</body>
</html>
