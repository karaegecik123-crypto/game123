<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Dünyam | v2.0.0 - YKS Akademi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #0a0a12; --blue: #16213e; --accent: #e94560; --green: #00ff41; --text: #e2e2e2; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--dark); color: var(--text); overflow: hidden; }
        
        header { background: #1a1a2e; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
        .version-group { display: flex; align-items: center; background: var(--accent); padding: 5px 15px; border-radius: 15px; cursor: pointer; font-weight: bold; }

        .container { display: flex; flex-direction: column; align-items: center; min-height: 80vh; padding-top: 50px; }
        .game-nav { display: none; justify-content: center; gap: 10px; background: #16213e; padding: 15px; width: 100%; }
        .nav-btn { background: transparent; border: 1px solid var(--accent); color: white; padding: 8px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .nav-btn.active { background: var(--accent); }

        .main-menu { display: flex; gap: 25px; }
        .menu-card { 
            width: 180px; height: 180px; background: #1a1a2e; border: 2px solid #333; 
            border-radius: 20px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.3s;
        }
        .menu-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .menu-card i { font-size: 3rem; margin-bottom: 15px; color: var(--accent); }

        #game-wrapper { display: none; position: relative; }
        canvas { background: #000; border: 3px solid #222; border-radius: 10px; }
        #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid var(--accent); border-radius: 5px; min-width: 130px; font-family: monospace; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a2e; padding: 30px; border-radius: 15px; border: 2px solid var(--accent); width: 600px; max-height: 80vh; overflow-y: auto; position: relative; }
        
        .course-list, .subject-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .course-btn { background: #16213e; border: 1px solid var(--accent); color: white; padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; }
        .subject-detail { background: #000; padding: 15px; border-left: 4px solid var(--green); margin-top: 10px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div onclick="showHome()" style="cursor:pointer; font-weight: bold;"><i class="fas fa-dragon"></i> DİJİTAL DÜNYA</div>
    <div class="version-group">v2.0.0 - YKS</div>
</header>

<div id="game-selector" class="game-nav">
    <button class="nav-btn" id="btn-snake" onclick="selectGame('snake')">SİNEK.IO</button>
    <button class="nav-btn" id="btn-tetris" onclick="selectGame('tetris')">TETRIS</button>
    <button class="nav-btn" id="btn-pacman" onclick="selectGame('pacman')">PACMAN</button>
</div>

<div class="container">
    <div id="main-ui" class="main-menu">
        <div class="menu-card" onclick="showGames()"><i class="fas fa-gamepad"></i><span>OYUNLAR</span></div>
        <div class="menu-card" onclick="toggleModal('study-modal')"><i class="fas fa-graduation-cap"></i><span>DERS NOTLARI</span></div>
        <div class="menu-card" onclick="alert('Sinema Modu Yakında!')"><i class="fas fa-film"></i><span>FİLMLER</span></div>
    </div>

    <div id="game-wrapper">
        <div id="leaderboard">
            <div style="text-align:center; color:var(--accent); font-size: 0.8rem;">TOP 5</div>
            <div id="lb-list"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over" class="modal" style="position: absolute;">
            <div class="modal-content" style="text-align:center;">
                <h1 style="color:var(--accent)">EYVAH!</h1>
                <p id="death-reason"></p>
                <button class="nav-btn" onclick="startGame()">TEKRAR</button>
                <button class="nav-btn" onclick="showHome()">MENÜ</button>
            </div>
        </div>
    </div>
</div>

<div id="study-modal" class="modal">
    <div class="modal-content">
        <span onclick="toggleModal('study-modal')" style="float:right; cursor:pointer;">&times;</span>
        <h2 id="study-title">YKS Ders Listesi</h2>
        <div id="study-body">
            <div class="course-list" id="course-list">
                </div>
        </div>
        <button id="back-btn" class="nav-btn hidden" onclick="renderCourses()" style="margin-top:20px;">Geri Dön</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let activeGame = 'snake', gameLoop, score = 0;
    let mouse = { x: 450, y: 275, down: false };

    // DERS VERİLERİ
    const studyData = {
        "Matematik": [
            {t: "Fonksiyonlar", d: "Tanım kümesi ve Değer kümesini karıştırma. f(x) grafiği okurken x eksenine odaklan."},
            {t: "Türev", d: "Teğet eğimi türeve eşittir. Maks-Min problemlerinde türevi sıfıra eşitlemeyi unutma."},
            {t: "İntegral", d: "Belirsiz integralde +C sabitini asla unutma! Alan hesaplarken x ekseninin altına dikkat."},
            {t: "Trigonometri", d: "Birim çember hayat kurtarır. Cos teoremi ve Sin teoremini ezberle."},
            {t: "Polinomlar", d: "P(x) polinomunun x-a ile bölümünden kalan P(a)'dır."},
            {t: "Karmaşık Sayılar", d: "i kare = -1. Eşlenik ile çarparak paydayı reel yapabilirsin."},
            {t: "Logaritma", d: "Taban 1 olamaz ve her zaman pozitif olmalı. log(a*b) = log a + log b."},
            {t: "Diziler", d: "Aritmetik ve Geometrik diziler arasındaki fark: Biri toplama diğeri çarpma ile artar."},
            {t: "Olasılık", d: "İstenen durum / Tüm durumlar. Koşullu olasılıkta örneklem uzay daralır."},
            {t: "Permütasyon", d: "Sıralama önemlidir. Tekrarlı permütasyonda özdeş nesne sayısına böl."}
        ],
        "Türkçe": [
            {t: "Yazım Kuralları", d: "Birleşik fiillerde ses düşmesi/türemesi varsa bitişik yazılır (Kaybolmak)."},
            {t: "Noktalama", d: "İki noktadan sonra açıklama geliyorsa büyük, örnek geliyorsa küçük harfle başlanır."},
            {t: "Paragraf", d: "Önce soruyu oku, sonra metni. Ana düşünce genelde son cümlededir."},
            {t: "Cümle Ögeleri", d: "Yüklemi bulduktan sonra ilk özneyi, sonra nesneyi bul (YÖN yöntemi)."},
            {t: "Fiilimsiler", d: "İsim-fiil (Ma-ış-mak), Sıfat-fiil (An-ası-mez-ar-dik-ecek-miş)."},
            {t: "Ses Bilgisi", d: "Ünsüz benzeşmesi (fıstıkçı şahap) ve yumuşamasına dikkat."},
            {t: "Anlatım Bozukluğu", d: "Özne-yüklem uyumsuzluğu ve gereksiz sözcük kullanımı en çok çıkanlardır."},
            {t: "Sözcükte Yapı", d: "Kök, gövde, yapım eki ve çekim ekini ayırırken anlam ilişkisini koparma."}
        ],
        "Fizik": [
            {t: "Vektörler", d: "Bileşke kuvvet bulurken uç uca ekleme veya paralelkenar yöntemini kullan."},
            {t: "Newton Kanunları", d: "F=m.a. Sürtünme kuvveti her zaman harekete zıt yönlü değildir (Yuvarlanma)."},
            {t: "Elektrik", d: "V=I.R (Ohm Kanunu). Paralel bağlı dirençlerde voltajlar eşittir."},
            {t: "Optik", d: "Işığın kırılmasında 'Az yoğun -> Çok yoğun' yaklaşırken 'Çok -> Az' uzaklaşır."},
            {t: "Modern Fizik", d: "Fotoelektrik olayda ışığın tanecik modeli kanıtlanır."},
            {t: "Dalgalar", d: "Boyuna dalga (Ses), Enine dalga (Işık). Su dalgası hem enine hem boyunadır."},
            {t: "Manyetizma", d: "Sağ el kuralı: Baş parmak akım, dört parmak manyetik alan."},
            {t: "Kütle Merkezi", d: "Simetrik cisimlerde geometrik merkezdir. Parça eklenirse merkez o yöne kayar."}
        ]
    };

    function showHome() { location.reload(); }
    function showGames() {
        document.getElementById('main-ui').classList.add('hidden');
        document.getElementById('game-selector').style.display = 'flex';
        selectGame('snake');
    }

    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        if(id === 'study-modal') renderCourses();
    }

    // DERS NOTLARI MANTIĞI
    function renderCourses() {
        document.getElementById('study-title').innerText = "YKS Ders Listesi";
        document.getElementById('back-btn').classList.add('hidden');
        let html = '';
        for(let course in studyData) {
            html += `<div class="course-btn" onclick="renderSubjects('${course}')">${course}</div>`;
        }
        document.getElementById('course-list').innerHTML = html;
        document.getElementById('course-list').classList.remove('hidden');
    }

    function renderSubjects(course) {
        document.getElementById('study-title').innerText = course + " Konuları";
        document.getElementById('course-list').classList.add('hidden');
        document.getElementById('back-btn').classList.remove('hidden');
        let html = '<div class="subject-list">';
        studyData[course].forEach(item => {
            html += `<div class="subject-detail"><strong>${item.t}</strong><p style="font-size:0.8rem; margin-top:5px;">${item.d}</p></div>`;
        });
        html += '</div>';
        document.getElementById('study-body').innerHTML = `<div id="course-list" class="course-list"></div>` + html;
    }

    // OYUN KONTROL
    function selectGame(game) {
        activeGame = game;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+game).classList.add('active');
        startGame();
    }

    function startGame() {
        clearInterval(gameLoop);
        score = 0;
        document.getElementById('game-wrapper').style.display = 'block';
        document.getElementById('game-over').style.display = 'none';
        
        if(activeGame === 'snake') initSnake();
        if(activeGame === 'tetris') initTetris();
        if(activeGame === 'pacman') initPacman();
    }

    // --- SNAKE.IO (Botlar Korundu) ---
    let player, bots, foods;
    function initSnake() {
        canvas.width = 800; canvas.height = 500;
        player = { segments: [{x:400,y:250}], angle:0, size:20, speed:3, color:'#e94560' };
        foods = Array.from({length:50}, () => ({x:Math.random()*800, y:Math.random()*500, c: `hsl(${Math.random()*360},70%,50%)`}));
        bots = ["AI-Zeka", "Robot-X", "Sinek-Bey"].map(n => ({
            name: n, segments: [{x:Math.random()*800, y:Math.random()*500}], angle: Math.random()*6, size: 15, speed: 2, color: '#555', alive: true
        }));
        gameLoop = setInterval(updateSnake, 1000/60);
    }

    function updateSnake() {
        ctx.fillStyle = '#05050a'; ctx.fillRect(0,0,800,500);
        
        // Player
        let target = Math.atan2(mouse.y - player.segments[0].y, mouse.x - player.segments[0].x);
        player.angle += (target - player.angle) * 0.1;
        let head = { x: player.segments[0].x + Math.cos(player.angle)*player.speed, y: player.segments[0].y + Math.sin(player.angle)*player.speed };
        
        if(head.x<0 || head.x>800 || head.y<0 || head.y>500) return die("Sınırı geçtin!");
        player.segments.unshift(head);
        if(player.segments.length > player.size) player.segments.pop();

        // Botlar
        bots.forEach(b => {
            if(!b.alive) return;
            b.angle += (Math.random()-0.5)*0.2;
            let bh = { x: b.segments[0].x + Math.cos(b.angle)*b.speed, y: b.segments[0].y + Math.sin(b.angle)*b.speed };
            if(bh.x<0 || bh.x>800 || bh.y<0 || bh.y>500) b.angle += Math.PI;
            b.segments.unshift(bh); if(b.segments.length > b.size) b.segments.pop();
            ctx.fillStyle = b.color; b.segments.forEach(s => ctx.fillRect(s.x, s.y, 8, 8));
        });

        // Food
        foods.forEach((f, i) => {
            ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI*2); ctx.fill();
            if(Math.hypot(player.segments[0].x-f.x, player.segments[0].y-f.y) < 15) {
                player.size += 2; score += 10; foods[i] = {x:Math.random()*800, y:Math.random()*500, c:f.c};
            }
        });

        ctx.fillStyle = player.color;
        player.segments.forEach(s => ctx.fillRect(s.x, s.y, 10, 10));
        updateLB();
    }

    function updateLB() {
        let list = [{n: "SEN", s: score}].concat(bots.filter(b=>b.alive).map(b=>({n:b.name, s:b.size*5})));
        list.sort((a,b)=>b.s-a.s);
        document.getElementById('lb-list').innerHTML = list.map(x=>`<div>${x.n}: ${x.s}</div>`).join('');
    }

    // --- TETRIS ---
    let board, piece, tetrominoes;
    function initTetris() {
        canvas.width = 240; canvas.height = 400;
        const scale = 20;
        ctx.scale(scale, scale);
        board = Array.from({length: 20}, () => Array(12).fill(0));
        tetrominoes = {
            'I': [[1,1,1,1]], 'J': [[1,0,0],[1,1,1]], 'L': [[0,0,1],[1,1,1]],
            'O': [[1,1],[1,1]], 'S': [[0,1,1],[1,1,0]], 'T': [[0,1,0],[1,1,1]], 'Z': [[1,1,0],[0,1,1]]
        };
        piece = resetPiece();
        gameLoop = setInterval(updateTetris, 500);
    }

    function resetPiece() {
        const types = 'IJLOSTZ';
        const type = types[Math.floor(Math.random()*types.length)];
        return { pos: {x: 4, y: 0}, matrix: tetrominoes[type], color: '#e94560' };
    }

    function updateTetris() {
        piece.pos.y++;
        if (collide()) { piece.pos.y--; merge(); piece = resetPiece(); if(collide()) die("Kule doldu!"); }
        drawTetris();
    }

    function collide() {
        const [m, o] = [piece.matrix, piece.pos];
        for(let y=0; y<m.length; y++) {
            for(let x=0; x<m[y].length; x++) {
                if(m[y][x] !== 0 && (board[y+o.y] && board[y+o.y][x+o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function merge() {
        piece.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if(value !== 0) board[y+piece.pos.y][x+piece.pos.x] = 1;
            });
        });
        // Satır silme
        board.forEach((row, y) => {
            if(row.every(v => v !== 0)) {
                board.splice(y, 1); board.unshift(Array(12).fill(0)); score += 100;
            }
        });
    }

    function drawTetris() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,12,20);
        board.forEach((row, y) => row.forEach((v, x) => { if(v) { ctx.fillStyle='blue'; ctx.fillRect(x,y,1,1); }}));
        piece.matrix.forEach((row, y) => row.forEach((v, x) => { if(v) { ctx.fillStyle=piece.color; ctx.fillRect(x+piece.pos.x, y+piece.pos.y,1,1); }}));
    }

    // --- PACMAN ---
    let pac, ghosts, dots;
    function initPacman() {
        canvas.width = 400; canvas.height = 400;
        pac = { x: 200, y: 200, dir: {x:0, y:0}, nextDir: {x:0,y:0} };
        dots = [];
        for(let i=0; i<40; i++) dots.push({x: Math.random()*380+10, y: Math.random()*380+10});
        ghosts = [
            {x: 20, y: 20, c: 'red'}, {x: 380, y: 380, c: 'pink'}
        ];
        gameLoop = setInterval(updatePacman, 1000/60);
    }

    function updatePacman() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,400,400);
        
        // Hareket
        pac.x += pac.dir.x * 2; pac.y += pac.dir.y * 2;
        if(pac.x < 0) pac.x = 400; if(pac.x > 400) pac.x = 0;
        if(pac.y < 0) pac.y = 400; if(pac.y > 400) pac.y = 0;

        // Puan toplama
        dots = dots.filter(d => {
            if(Math.hypot(pac.x-d.x, pac.y-d.y) < 10) { score += 5; return false; }
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, Math.PI*2); ctx.fill();
            return true;
        });

        // Hayaletler
        ghosts.forEach(g => {
            g.x += (pac.x - g.x) * 0.01; g.y += (pac.y - g.y) * 0.01;
            ctx.fillStyle = g.c; ctx.beginPath(); ctx.arc(g.x, g.y, 12, 0, Math.PI, true); ctx.lineTo(g.x+12, g.y+15); ctx.lineTo(g.x-12, g.y+15); ctx.fill();
            if(Math.hypot(pac.x-g.x, pac.y-g.y) < 20) die("Hayalet seni yakaladı!");
        });

        // Pacman çizim
        ctx.fillStyle = 'yellow'; ctx.beginPath();
        ctx.arc(pac.x, pac.y, 15, 0.2 * Math.PI, 1.8 * Math.PI);
        ctx.lineTo(pac.x, pac.y); ctx.fill();
    }

    function die(r) { clearInterval(gameLoop); document.getElementById('death-reason').innerText = r; document.getElementById('game-over').style.display = 'flex'; }

    // GİRDİLER
    window.addEventListener('keydown', e => {
        if(activeGame === 'tetris') {
            if(e.key === 'ArrowLeft') { piece.pos.x--; if(collide()) piece.pos.x++; }
            if(e.key === 'ArrowRight') { piece.pos.x++; if(collide()) piece.pos.x--; }
            if(e.key === 'ArrowDown') { piece.pos.y++; if(collide()) piece.pos.y--; }
            if(e.key === 'ArrowUp') { 
                const old = piece.matrix;
                piece.matrix = piece.matrix[0].map((_, i) => piece.matrix.map(row => row[i]).reverse());
                if(collide()) piece.matrix = old;
            }
        }
        if(activeGame === 'pacman') {
            if(e.key === 'ArrowLeft') pac.dir = {x:-1, y:0};
            if(e.key === 'ArrowRight') pac.dir = {x:1, y:0};
            if(e.key === 'ArrowUp') pac.dir = {x:0, y:-1};
            if(e.key === 'ArrowDown') pac.dir = {x:0, y:1};
        }
    });

    canvas.addEventListener('mousemove', e => {
        const r = canvas.getBoundingClientRect();
        mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    });
</script>
</body>
</html>
