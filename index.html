<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Akademi & Oyun Dünyası | v4.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #05050a; --panel: #1a1a2e; --accent: #e94560; --green: #00ff41; --text: #e2e2e2; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--dark); color: var(--text); overflow: hidden; }
        header { background: var(--panel); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
        .nav-btn { background: transparent; border: 1px solid var(--accent); color: white; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; margin: 0 5px; }
        .nav-btn.active { background: var(--accent); }
        .container { display: flex; flex-direction: column; align-items: center; padding-top: 20px; height: 90vh; }
        .main-menu { display: flex; gap: 20px; }
        .menu-card { width: 160px; height: 160px; background: var(--panel); border: 2px solid #333; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; }
        .menu-card:hover { border-color: var(--accent); transform: scale(1.05); }
        #game-wrapper { display: none; position: relative; }
        canvas { background: #000; border: 3px solid #222; border-radius: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--panel); padding: 25px; border-radius: 15px; border: 2px solid var(--accent); width: 85%; max-width: 1000px; max-height: 85vh; overflow-y: auto; }
        .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 20px; }
        .item-card { background: #16213e; padding: 15px; border-radius: 10px; cursor: pointer; border: 1px solid #333; text-align: center; font-size: 0.9rem; }
        .item-card:hover { border-color: var(--accent); background: #1a1a2e; }
        .study-section { background: #0a0a12; padding: 20px; border-radius: 10px; margin-top: 15px; }
        .tip-box { border-left: 3px solid var(--green); padding: 8px; margin-bottom: 8px; background: #111; font-size: 0.9rem; }
        .test-q { margin-bottom: 25px; padding: 15px; background: #1a1a2e; border-radius: 8px; border-left: 4px solid #444; }
        .opt { display: block; margin: 8px 0; cursor: pointer; padding: 10px; border: 1px solid #444; border-radius: 5px; transition: 0.2s; }
        .opt:hover { background: #252545; }
        .opt.selected { background: var(--accent); border-color: white; }
        .correct { color: var(--green); font-weight: bold; }
        .wrong { color: var(--accent); font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div onclick="showHome()" style="cursor:pointer; font-weight:bold; font-size:1.4rem;"><i class="fas fa-dragon"></i> DİJİTAL DÜNYA v4.0</div>
    <div id="game-selector" style="display:none;">
        <button class="nav-btn" id="btn-snake" onclick="selectGame('snake')">SİNEK.IO</button>
        <button class="nav-btn" id="btn-tetris" onclick="selectGame('tetris')">TETRIS</button>
        <button class="nav-btn" id="btn-pacman" onclick="selectGame('pacman')">PACMAN</button>
    </div>
</header>

<div class="container">
    <div id="main-ui" class="main-menu">
        <div class="menu-card" onclick="showGames()"><i class="fas fa-gamepad" style="font-size:3rem; color:var(--accent)"></i><span>OYUNLAR</span></div>
        <div class="menu-card" onclick="openAcademy()"><i class="fas fa-graduation-cap" style="font-size:3rem; color:var(--green)"></i><span>DERS NOTLARI</span></div>
    </div>

    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
</div>

<div id="academy-modal" class="modal">
    <div class="modal-content">
        <span onclick="closeModal()" style="float:right; cursor:pointer; font-size:2rem;">&times;</span>
        <div id="academy-view">
            <h2 id="view-title">Dersler</h2>
            <div id="view-content" class="grid-list"></div>
            <div id="view-actions" style="margin-top:20px;"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let activeGame, gameLoop, score = 0;
    let mouse = { x: 400, y: 250 };

    // --- DEV AKADEMİ VERİSİ ---
    const subjectsTemplate = (name) => ({
        tips: [`${name} için temel kavramları adın gibi bil.`, "Çıkmış soruları mutlaka çöz.", "Bol bol pratik yap, hata yapmaktan korkma.", "Konu özetlerini kendin çıkar.", "Zaman yönetimine dikkat et."],
        example: `${name} konusunda temel bir örnek soru...`,
        solution: "Adım adım çözüm yolu burada.",
        logic: "Bu soruda kilit nokta şuydu...",
        test: Array(5).fill({q: "Örnek soru?", a: ["Şık A","Şık B","Şık C","Şık D","Şık E"], c: 0, sol: "Çözüm açıklaması."})
    });

    const academyData = {
        "Matematik": {
            "Temel Kavramlar": subjectsTemplate("Temel Kavramlar"),
            "Üslü Sayılar": subjectsTemplate("Üslü Sayılar"),
            "Köklü Sayılar": subjectsTemplate("Köklü Sayılar"),
            "Polinomlar": subjectsTemplate("Polinomlar"),
            "Fonksiyonlar": subjectsTemplate("Fonksiyonlar"),
            "Trigonometri": subjectsTemplate("Trigonometri"),
            "Türev": {
                tips: ["Teğet eğimi türeve eşittir.", "Hız, yolun türevidir.", "Bileşke fonksiyonda zincir kuralı uygulanır.", "Maks-Min problemlerinde türev sıfırlanır.", "Sabitin türevi sıfırdır."],
                example: "f(x) = x³ + 2x ise f'(1) nedir?",
                solution: "f'(x) = 3x² + 2. x=1 için 3(1)² + 2 = 5.",
                logic: "Üssü başa indir ve dereceyi bir azalt.",
                test: [
                    {q: "f(x) = 7x ise f'(10) nedir?", a: ["0","7","10","70","1"], c: 1, sol: "Doğrusal fonksiyonun türevi eğimidir."},
                    {q: "x² türevi?", a: ["x","1","2x","x²","2"], c: 2, sol: "2 başa iner."},
                    {q: "Sabit fonksiyon türevi?", a: ["1","x","0","Sonsuz","Kendisi"], c: 2, sol: "Değişim yoktur, türev 0'dır."},
                    {q: "f(x)=sin x türevi?", a: ["cos x","-sin x","tan x","1","0"], c: 0, sol: "Sin -> Cos."},
                    {q: "f(x)=e^x türevi?", a: ["e^x","xe^(x-1)","1","0","ln x"], c: 0, sol: "e^x değişmez."}
                ]
            },
            "İntegral": subjectsTemplate("İntegral"),
            "Logaritma": subjectsTemplate("Logaritma"),
            "Diziler": subjectsTemplate("Diziler")
        },
        "Türkçe": {
            "Paragraf": subjectsTemplate("Paragraf"),
            "Sözcükte Anlam": subjectsTemplate("Sözcükte Anlam"),
            "Cümlede Anlam": subjectsTemplate("Cümlede Anlam"),
            "Yazım Kuralları": subjectsTemplate("Yazım Kuralları"),
            "Noktalama İşaretleri": subjectsTemplate("Noktalama İşaretleri"),
            "Dil Bilgisi": subjectsTemplate("Dil Bilgisi"),
            "Cümle Ögeleri": subjectsTemplate("Cümle Ögeleri"),
            "Ses Bilgisi": subjectsTemplate("Ses Bilgisi")
        },
        "Fizik": {
            "Vektörler": subjectsTemplate("Vektörler"),
            "Kuvvet ve Hareket": subjectsTemplate("Kuvvet ve Hareket"),
            "Enerji": subjectsTemplate("Enerji"),
            "Elektrik": subjectsTemplate("Elektrik"),
            "Optik": subjectsTemplate("Optik"),
            "Dalgalar": subjectsTemplate("Dalgalar"),
            "Modern Fizik": subjectsTemplate("Modern Fizik"),
            "Manyetizma": subjectsTemplate("Manyetizma")
        },
        "Kimya": {
            "Atom ve Yapısı": subjectsTemplate("Atom"),
            "Periyodik Sistem": subjectsTemplate("Periyodik Sistem"),
            "Kimyasal Bağlar": subjectsTemplate("Kimyasal Bağlar"),
            "Mol Kavramı": subjectsTemplate("Mol"),
            "Asit-Baz": subjectsTemplate("Asit-Baz"),
            "Organik Kimya": subjectsTemplate("Organik Kimya"),
            "Enerji": subjectsTemplate("Enerji"),
            "Hız ve Denge": subjectsTemplate("Hız ve Denge")
        },
        "Biyoloji": {
            "Hücre": subjectsTemplate("Hücre"),
            "Canlıların Ortak Özellikleri": subjectsTemplate("Canlılar"),
            "Kalıtım": subjectsTemplate("Kalıtım"),
            "Ekoloji": subjectsTemplate("Ekoloji"),
            "Sistemler": subjectsTemplate("Sistemler"),
            "Bitki Biyolojisi": subjectsTemplate("Bitki"),
            "Fotosentez": subjectsTemplate("Fotosentez"),
            "Solunum": subjectsTemplate("Solunum")
        },
        "Tarih": {
            "İslamiyet Öncesi": subjectsTemplate("Tarih"),
            "Osmanlı Kuruluş": subjectsTemplate("Osmanlı"),
            "Kurtuluş Savaşı": subjectsTemplate("Kurtuluş"),
            "İnkılap Tarihi": subjectsTemplate("İnkılap"),
            "Dünya Savaşı": subjectsTemplate("Savaş"),
            "İlk Çağ Uygarlıkları": subjectsTemplate("Uygarlık"),
            "Selçuklu Tarihi": subjectsTemplate("Selçuklu"),
            "Atatürk İlkeleri": subjectsTemplate("Atatürk")
        },
        "Coğrafya": {
            "Harita Bilgisi": subjectsTemplate("Harita"),
            "İklim Bilgisi": subjectsTemplate("İklim"),
            "Nüfus": subjectsTemplate("Nüfus"),
            "Türkiye Coğrafyası": subjectsTemplate("Türkiye"),
            "Doğal Afetler": subjectsTemplate("Afet"),
            "Ekonomik Faaliyetler": subjectsTemplate("Ekonomi"),
            "Dünya Şekli": subjectsTemplate("Dünya"),
            "Bölgeler": subjectsTemplate("Bölgeler")
        },
        "Felsefe": {
            "Bilgi Felsefesi": subjectsTemplate("Bilgi"),
            "Varlık Felsefesi": subjectsTemplate("Varlık"),
            "Ahlak Felsefesi": subjectsTemplate("Ahlak"),
            "Siyaset Felsefesi": subjectsTemplate("Siyaset"),
            "Din Felsefesi": subjectsTemplate("Din"),
            "Bilim Felsefesi": subjectsTemplate("Bilim"),
            "Felsefeye Giriş": subjectsTemplate("Giriş"),
            "Sanat Felsefesi": subjectsTemplate("Sanat")
        }
    };

    // --- SİSTEM FONKSİYONLARI ---
    function showHome() { location.reload(); }
    function showGames() {
        document.getElementById('main-ui').classList.add('hidden');
        document.getElementById('game-selector').style.display = 'block';
        selectGame('snake');
    }
    function openAcademy() {
        document.getElementById('academy-modal').style.display = 'flex';
        renderCourses();
    }
    function closeModal() { document.getElementById('academy-modal').style.display = 'none'; }

    function renderCourses() {
        const content = document.getElementById('view-content');
        content.className = 'grid-list';
        content.innerHTML = '';
        document.getElementById('view-title').innerText = "YKS Ders Listesi";
        for(let c in academyData) {
            let div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<h3>${c}</h3><p>${Object.keys(academyData[c]).length} Konu</p>`;
            div.onclick = () => renderSubjects(c);
            content.appendChild(div);
        }
        document.getElementById('view-actions').innerHTML = '';
    }

    function renderSubjects(course) {
        const content = document.getElementById('view-content');
        content.innerHTML = '';
        document.getElementById('view-title').innerText = course + " Konuları";
        for(let s in academyData[course]) {
            let div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<h4>${s}</h4>`;
            div.onclick = () => renderDetail(course, s);
            content.appendChild(div);
        }
        document.getElementById('view-actions').innerHTML = `<button class="nav-btn" onclick="renderCourses()">Derslere Dön</button>`;
    }

    function renderDetail(course, subject) {
        const data = academyData[course][subject];
        const content = document.getElementById('view-content');
        content.className = '';
        content.innerHTML = `
            <div class="study-section">
                <h3>💡 5 Kritik İpucu</h3>
                ${data.tips.map(t => `<div class="tip-box">${t}</div>`).join('')}
            </div>
            <div class="study-section" style="border-top: 2px solid var(--accent)">
                <h3>📝 Örnek Soru</h3>
                <p><strong>Soru:</strong> ${data.example}</p>
                <p class="correct"><strong>Çözüm:</strong> ${data.solution}</p>
                <p><em><strong>Düşünme Yolu:</strong> ${data.logic}</em></p>
            </div>
            <div style="margin-top:20px; text-align:center;">
                <button class="nav-btn" style="background:var(--green); color:black; width:100%; padding:15px;" onclick="startTest('${course}','${subject}')">KONU TESTİNİ ÇÖZ</button>
            </div>
        `;
        document.getElementById('view-actions').innerHTML = `<button class="nav-btn" onclick="renderSubjects('${course}')">Konulara Dön</button>`;
    }

    let userAnswers = [];
    function startTest(course, subject) {
        const data = academyData[course][subject];
        const content = document.getElementById('view-content');
        userAnswers = new Array(5).fill(null);
        content.innerHTML = data.test.map((q, i) => `
            <div class="test-q">
                <p><strong>Soru ${i+1}:</strong> ${q.q}</p>
                ${q.a.map((opt, oi) => `<div class="opt" id="q${i}o${oi}" onclick="selectOpt(${i},${oi})">${String.fromCharCode(65+oi)}) ${opt}</div>`).join('')}
            </div>
        `).join('');
        document.getElementById('view-actions').innerHTML = `<button id="finish-btn" class="nav-btn hidden" style="background:var(--accent); width:100%" onclick="calcResult('${course}','${subject}')">Testi Bitir ve Analiz Et</button>`;
    }

    function selectOpt(q, o) {
        userAnswers[q] = o;
        document.querySelectorAll(`[id^="q${q}o"]`).forEach(el => el.classList.remove('selected'));
        document.getElementById(`q${q}o${o}`).classList.add('selected');
        if(!userAnswers.includes(null)) document.getElementById('finish-btn').classList.remove('hidden');
    }

    function calcResult(course, subject) {
        const data = academyData[course][subject];
        const content = document.getElementById('view-content');
        let cCount = 0, wCount = 0;
        let resHtml = `<h3>Test Sonucu: ${subject}</h3>`;
        data.test.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.c;
            if(isCorrect) cCount++; else wCount++;
            resHtml += `
                <div class="test-q" style="border-color:${isCorrect ? 'var(--green)' : 'var(--accent)'}">
                    <p>Soru ${i+1}: ${isCorrect ? '✅' : '❌'}</p>
                    <p class="correct">Cevap: ${String.fromCharCode(65+q.c)}</p>
                    <p style="background:#000; padding:10px; margin-top:5px;"><strong>Analiz:</strong> ${q.sol}</p>
                </div>`;
        });
        content.innerHTML = `<div style="text-align:center; font-size:1.5rem; margin-bottom:20px;">${cCount} Doğru / ${wCount} Yanlış <br> Puan: ${cCount*20}</div>` + resHtml;
        document.getElementById('view-actions').innerHTML = `<button class="nav-btn" onclick="renderDetail('${course}','${subject}')">Konuya Dön</button>`;
    }

    // --- OYUNLAR ---
    function selectGame(game) {
        activeGame = game;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+game).classList.add('active');
        document.getElementById('game-wrapper').style.display = 'block';
        startGame();
    }

    function startGame() {
        clearInterval(gameLoop);
        if(activeGame === 'snake') initSnake();
        if(activeGame === 'tetris') initTetris();
        if(activeGame === 'pacman') initPacman();
    }

    // 1. SNAKE (Mouse Takip Düzeltildi)
    let sn;
    function initSnake() {
        canvas.width = 800; canvas.height = 500;
        sn = { head: {x:400,y:250}, body: [], angle: 0, size: 5 };
        gameLoop = setInterval(() => {
            ctx.fillStyle = '#05050a'; ctx.fillRect(0,0,800,500);
            let dx = mouse.x - sn.head.x, dy = mouse.y - sn.head.y;
            let target = Math.atan2(dy, dx);
            let diff = target - sn.angle;
            while(diff < -Math.PI) diff += Math.PI*2;
            while(diff > Math.PI) diff -= Math.PI*2;
            sn.angle += diff * 0.15;
            sn.head.x += Math.cos(sn.angle) * 4;
            sn.head.y += Math.sin(sn.angle) * 4;
            sn.body.unshift({...sn.head});
            if(sn.body.length > sn.size * 5) sn.body.pop();
            ctx.fillStyle = var(--accent);
            sn.body.forEach((b, i) => { if(i%5===0) ctx.fillRect(b.x-5, b.y-5, 10, 10); });
        }, 1000/60);
    }

    // 2. TETRIS
    function initTetris() {
        canvas.width = 300; canvas.height = 500;
        ctx.fillStyle = 'white'; ctx.fillText("Tetris Yükleniyor...", 100, 250);
    }

    // 3. PACMAN
    function initPacman() {
        canvas.width = 500; canvas.height = 400;
        ctx.fillStyle = 'yellow'; ctx.fillText("Pacman Yükleniyor...", 200, 200);
    }

    window.addEventListener('mousemove', e => {
        const r = canvas.getBoundingClientRect();
        mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    });
</script>
</body>
</html>
