<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijital Dünya v1.3.0 | Sinek.io Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #05050a; --accent: #e94560; --green: #00ff41; --panel: #1a1a2e; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--dark); color: #fff; overflow: hidden; }
        
        /* UI Tasarım */
        header { background: var(--panel); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
        .container { display: flex; flex-direction: column; align-items: center; padding-top: 20px; }
        
        #game-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; }
        canvas { background: radial-gradient(circle, #0f0f1a 0%, #05050a 100%); border: 2px solid #333; cursor: crosshair; }

        /* Liderlik Tablosu */
        #leaderboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7);
            padding: 15px; border-radius: 10px; border: 1px solid var(--accent);
            min-width: 150px; font-family: monospace; pointer-events: none;
        }
        #leaderboard h3 { margin: 0 0 10px 0; color: var(--accent); font-size: 1rem; text-align: center; }
        .lb-entry { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
        .lb-player { color: gold; font-weight: bold; }

        .hud-bottom { margin-top: 10px; color: var(--green); font-weight: bold; }
        .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 40px; border: 2px solid var(--accent); text-align: center; border-radius: 20px; display: none; z-index: 100; }
        .game-btn { background: var(--accent); border: none; color: white; padding: 12px 30px; cursor: pointer; border-radius: 5px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <div onclick="location.reload()" style="cursor:pointer; letter-spacing: 2px;"><i class="fas fa-crown"></i> DİJİTAL DÜNYA</div>
    <div style="color:var(--accent); font-weight:bold;">v1.3.0 PRO</div>
</header>

<div class="container">
    <div id="game-wrapper">
        <div id="leaderboard">
            <h3>SIRALAMA</h3>
            <div id="lb-content"></div>
        </div>
        <canvas id="mainCanvas"></canvas>
        <div id="game-over" class="overlay">
            <h1 style="color:var(--accent)">ELENDİN!</h1>
            <p id="death-reason" style="margin-bottom: 20px;"></p>
            <button class="game-btn" onclick="initGame()">TEKRAR BAŞLA</button>
            <br>
            <button class="game-btn" style="background:#444" onclick="location.reload()">MENÜ</button>
        </div>
        <div class="hud-bottom">
            Mousu Hareket Ettir | Tıkla: Turbo | Dünya: <span id="stat-world">1-1</span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    const lbContent = document.getElementById("lb-content");

    let mouse = { x: 400, y: 300, down: false };
    let player, ais, foods, gameLoop;
    let score = 0;

    // Mouse Takibi
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
    });
    window.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);

    let stats = JSON.parse(localStorage.getItem('dw_v130')) || { w: 1, l: 1 };

    function initGame() {
        canvas.width = 1000; canvas.height = 650;
        clearInterval(gameLoop);
        score = 0;
        document.getElementById('game-over').style.display = 'none';

        // Oyuncu Başlat
        player = {
            name: "SENSİN", segments: [{x: 500, y: 325}], angle: 0, 
            speed: 3, size: 20, color: '#e94560', alive: true
        };

        // AI Başlat
        ais = [];
        const names = ["Yamyam", "Zehir", "Rüzgar", "Hızlı", "Gölge"];
        for(let i=0; i<5; i++) ais.push(createAI(names[i]));

        foods = Array.from({length: 80}, () => spawnFood());

        gameLoop = setInterval(update, 1000/60);
    }

    function createAI(name) {
        return {
            name: name, segments: [{x: Math.random()*1000, y: Math.random()*650}],
            angle: Math.random()*Math.PI*2, speed: 2.5, 
            size: 15 + Math.random()*25, 
            color: `hsl(${Math.random()*360}, 70%, 50%)`, alive: true
        };
    }

    function spawnFood() {
        return { x: Math.random()*1000, y: Math.random()*650, c: `hsl(${Math.random()*360}, 80%, 60%)` };
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // OYUNCU HAREKET (Mouse Takibi)
        let targetAngle = Math.atan2(mouse.y - player.segments[0].y, mouse.x - player.segments[0].x);
        let diff = targetAngle - player.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        player.angle += diff * 0.15; // Dönüş hızı

        let currentSpeed = mouse.down ? player.speed * 2 : player.speed;
        let head = {
            x: player.segments[0].x + Math.cos(player.angle) * currentSpeed,
            y: player.segments[0].y + Math.sin(player.angle) * currentSpeed
        };

        // Duvar Kontrol
        if(head.x < 0 || head.x > canvas.width || head.y < 0 || head.y > canvas.height) return die("Kenara çarptın!");

        player.segments.unshift(head);
        if(player.segments.length > player.size) player.segments.pop();

        // AI HAREKET & ZEKA
        ais.forEach(ai => {
            if(!ai.alive) return;

            // En yakın yemeği bul
            let minDist = 1000, targetFood = foods[0];
            foods.forEach(f => {
                let d = Math.hypot(ai.segments[0].x - f.x, ai.segments[0].y - f.y);
                if(d < minDist) { minDist = d; targetFood = f; }
            });

            let aiTargetAngle = Math.atan2(targetFood.y - ai.segments[0].y, targetFood.x - ai.segments[0].x);
            
            // Oyuncudan kaçma/kovalama
            let dToP = Math.hypot(ai.segments[0].x - player.segments[0].x, ai.segments[0].y - player.segments[0].y);
            if(dToP < 120) {
                if(ai.size < player.size) aiTargetAngle += Math.PI; // Kaç
                else aiTargetAngle = Math.atan2(player.segments[0].y - ai.segments[0].y, player.segments[0].x - ai.segments[0].x); // Saldır
            }

            let aiDiff = aiTargetAngle - ai.angle;
            while (aiDiff < -Math.PI) aiDiff += Math.PI * 2;
            while (aiDiff > Math.PI) aiDiff -= Math.PI * 2;
            ai.angle += aiDiff * 0.1;

            let aiHead = {
                x: ai.segments[0].x + Math.cos(ai.angle) * ai.speed,
                y: ai.segments[0].y + Math.sin(ai.angle) * ai.speed
            };

            // AI Duvar Sekmesi
            if(aiHead.x < 10 || aiHead.x > 990) ai.angle = Math.PI - ai.angle;
            if(aiHead.y < 10 || aiHead.y > 640) ai.angle = -ai.angle;

            ai.segments.unshift(aiHead);
            if(ai.segments.length > ai.size) ai.segments.pop();

            // Çarpışma: AI Oyuncunun Vücuduna Çarparsa
            player.segments.forEach((s, i) => {
                if(i > 8 && Math.hypot(ai.segments[0].x - s.x, ai.segments[0].y - s.y) < 12) {
                    ai.alive = false; spawnGhostFood(ai.segments);
                }
            });
        });

        // Oyuncu AI'ların Vücuduna Çarparsa
        ais.forEach(ai => {
            if(!ai.alive) return;
            ai.segments.forEach((s, i) => {
                if(Math.hypot(player.segments[0].x - s.x, player.segments[0].y - s.y) < 12) {
                    // Kafa kafaya ise boyuta bak
                    if(i === 0) {
                        if(player.size > ai.size) { ai.alive = false; score += 100; }
                        else return die(`${ai.name} seni kafa kafaya yedi!`);
                    } else return die(`${ai.name} sineğinin vücuduna çarptın!`);
                }
            });
        });

        // Yemek Toplama
        foods.forEach((f, i) => {
            if(Math.hypot(player.segments[0].x - f.x, player.segments[0].y - f.y) < 15) {
                player.size += 2; score += 10; foods[i] = spawnFood();
            }
            ais.forEach(ai => {
                if(ai.alive && Math.hypot(ai.segments[0].x - f.x, ai.segments[0].y - f.y) < 15) {
                    ai.size += 2; foods[i] = spawnFood();
                }
            });
        });

        // ÇİZİM
        foods.forEach(f => {
            ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI*2); ctx.fill();
        });

        ais.forEach(ai => {
            if(!ai.alive) return;
            ctx.fillStyle = ai.color;
            ai.segments.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, Math.PI*2); ctx.fill(); });
        });

        ctx.fillStyle = player.color;
        ctx.shadowBlur = mouse.down ? 20 : 0; ctx.shadowColor = player.color;
        player.segments.forEach((s, i) => {
            ctx.beginPath(); ctx.arc(s.x, s.y, i===0 ? 11 : 9, 0, Math.PI*2); ctx.fill();
        });
        ctx.shadowBlur = 0;

        // Ölenleri canlandır
        if(ais.filter(a => a.alive).length < 5) {
            const names = ["Kurt", "Kartal", "Boğa", "Aslan", "Yılan"];
            ais.push(createAI(names[Math.floor(Math.random()*5)]));
        }

        updateLeaderboard();
        checkLevel();
    }

    function spawnGhostFood(segs) {
        segs.forEach((s, i) => { if(i%3===0) foods.push({x: s.x, y: s.y, c: '#fff'}); });
    }

    function updateLeaderboard() {
        let list = [{ name: player.name, score: Math.floor(player.size * 10), isPlayer: true }];
        ais.forEach(ai => { if(ai.alive) list.push({ name: ai.name, score: Math.floor(ai.size * 10) }); });
        list.sort((a,b) => b.score - a.score);

        lbContent.innerHTML = list.map((entry, i) => `
            <div class="lb-entry ${entry.isPlayer ? 'lb-player' : ''}">
                <span>${i+1}. ${entry.name}</span>
                <span>${entry.score}</span>
            </div>
        `).join('');
    }

    function checkLevel() {
        if(score > stats.l * 500) {
            stats.l++; if(stats.l > stats.w * 10) { stats.w++; stats.l = 1; }
            localStorage.setItem('dw_v130', JSON.stringify(stats));
            document.getElementById('stat-world').innerText = `${stats.w}-${stats.l}`;
        }
    }

    function die(msg) {
        clearInterval(gameLoop);
        document.getElementById('death-reason').innerText = msg;
        document.getElementById('game-over').style.display = 'block';
    }

    window.onload = initGame;
</script>
</body>
</html>
