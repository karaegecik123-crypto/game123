<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Dünyam | v2.2.0 - Pro Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #0a0a12; --blue: #16213e; --accent: #e94560; --green: #00ff41; --text: #e2e2e2; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: var(--dark); color: var(--text); overflow: hidden; }
        header { background: #1a1a2e; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
        .version-group { background: var(--accent); padding: 5px 15px; border-radius: 15px; font-weight: bold; }
        .container { display: flex; flex-direction: column; align-items: center; min-height: 80vh; padding-top: 50px; }
        .game-nav { display: none; justify-content: center; gap: 10px; background: #16213e; padding: 15px; width: 100%; }
        .nav-btn { background: transparent; border: 1px solid var(--accent); color: white; padding: 8px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .nav-btn.active { background: var(--accent); }
        .main-menu { display: flex; gap: 25px; }
        .menu-card { width: 180px; height: 180px; background: #1a1a2e; border: 2px solid #333; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s; }
        .menu-card:hover { border-color: var(--accent); transform: translateY(-10px); }
        .menu-card i { font-size: 3rem; margin-bottom: 15px; color: var(--accent); }
        #game-wrapper { display: none; position: relative; }
        canvas { background: #000; border: 3px solid #222; border-radius: 10px; }
        #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.85); padding: 10px; border: 1px solid var(--accent); border-radius: 5px; min-width: 140px; font-family: monospace; display: none; }
        .lb-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 2px 0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a2e; padding: 30px; border-radius: 15px; border: 2px solid var(--accent); width: 600px; max-height: 85vh; overflow-y: auto; position: relative; }
        .course-btn { background: #16213e; border: 1px solid var(--accent); color: white; padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; margin: 5px; }
        .subject-detail { background: #000; padding: 15px; border-left: 4px solid var(--green); margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div onclick="showHome()" style="cursor:pointer; font-weight: bold;"><i class="fas fa-dragon"></i> DİJİTAL DÜNYA</div>
    <div class="version-group">v2.2.0</div>
</header>

<div id="game-selector" class="game-nav">
    <button class="nav-btn" id="btn-snake" onclick="selectGame('snake')">SİNEK.IO</button>
    <button class="nav-btn" id="btn-tetris" onclick="selectGame('tetris')">TETRIS</button>
    <button class="nav-btn" id="btn-pacman" onclick="selectGame('pacman')">PACMAN</button>
</div>

<div class="container">
    <div id="main-ui" class="main-menu">
        <div class="menu-card" onclick="showGames()"><i class="fas fa-gamepad"></i><span>OYUNLAR</span></div>
        <div class="menu-card" onclick="toggleModal('study-modal')"><i class="fas fa-graduation-cap"></i><span>DERS NOTLARI</span></div>
    </div>

    <div id="game-wrapper">
        <div id="leaderboard">
            <div style="text-align:center; color:var(--accent); font-weight:bold;">LİDERLER</div>
            <div id="lb-list"></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over" class="modal" style="position: absolute;">
            <div class="modal-content" style="text-align:center;">
                <h1 style="color:var(--accent)">OYUN BİTTİ!</h1>
                <p id="death-reason"></p>
                <button class="nav-btn" onclick="startGame()">TEKRAR</button>
                <button class="nav-btn" onclick="showHome()">MENÜ</button>
            </div>
        </div>
    </div>
</div>

<div id="study-modal" class="modal">
    <div class="modal-content">
        <span onclick="toggleModal('study-modal')" style="float:right; cursor:pointer;">&times;</span>
        <h2 id="study-title">YKS Notları</h2>
        <div id="study-body"><div style="display: grid; grid-template-columns: 1fr 1fr;" id="course-list"></div></div>
        <button id="back-btn" class="nav-btn hidden" onclick="renderCourses()" style="margin-top:20px;">Geri Dön</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let activeGame = 'snake', gameLoop, score = 0;
    let mouse = { x: 400, y: 250 };

    // --- GENEL SİSTEM ---
    function showHome() { location.reload(); }
    function showGames() {
        document.getElementById('main-ui').classList.add('hidden');
        document.getElementById('game-selector').style.display = 'flex';
        selectGame('snake');
    }
    function toggleModal(id) {
        const m = document.getElementById(id);
        m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        if(id === 'study-modal') renderCourses();
    }

    function selectGame(game) {
        activeGame = game;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+game).classList.add('active');
        startGame();
    }

    function startGame() {
        clearInterval(gameLoop);
        score = 0;
        document.getElementById('game-wrapper').style.display = 'block';
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('leaderboard').style.display = (activeGame === 'snake') ? 'block' : 'none';
        if(activeGame === 'snake') initSnake();
        if(activeGame === 'tetris') initTetris();
        if(activeGame === 'pacman') initPacman();
    }

    // --- SNAKE.IO (DÜZELTİLMİŞ MOUSE TAKİBİ) ---
    let player, bots, foods;
    function initSnake() {
        canvas.width = 800; canvas.height = 500;
        player = { segments: [{x:400,y:250}], angle:0, size:20, speed:4, color:'#e94560' };
        foods = Array.from({length:50}, () => ({x:Math.random()*800, y:Math.random()*500, c:`hsl(${Math.random()*360},70%,50%)`}));
        bots = ["AI-Rex","CyberBot","Bot3000"].map(n => ({
            name:n, segments:[{x:Math.random()*800,y:Math.random()*500}], angle:Math.random()*6, size:18, speed:2.5, color:'#555', alive:true
        }));
        gameLoop = setInterval(updateSnake, 1000/60);
    }

    function updateSnake() {
        ctx.fillStyle = '#05050a'; ctx.fillRect(0,0,800,500);
        
        // Gelişmiş Mouse Takibi
        let dx = mouse.x - player.segments[0].x;
        let dy = mouse.y - player.segments[0].y;
        let targetAngle = Math.atan2(dy, dx);
        
        // Açı yumuşatma (Yılanın daha doğal dönmesini sağlar ama artık daha hızlı tepki verir)
        let diff = targetAngle - player.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        player.angle += diff * 0.2; 

        let head = { 
            x: player.segments[0].x + Math.cos(player.angle) * player.speed, 
            y: player.segments[0].y + Math.sin(player.angle) * player.speed 
        };

        if(head.x<0||head.x>800||head.y<0||head.y>500) return die("Sınırı aştın!");
        player.segments.unshift(head);
        if(player.segments.length > player.size) player.segments.pop();

        // Botlar ve Yemekler (Aynı mantık)
        bots.forEach(b => {
            if(!b.alive) return;
            b.angle += (Math.random()-0.5)*0.2;
            let bh = { x: b.segments[0].x + Math.cos(b.angle)*b.speed, y: b.segments[0].y + Math.sin(b.angle)*b.speed };
            if(bh.x<10||bh.x>790||bh.y<10||bh.y>490) b.angle += Math.PI;
            b.segments.unshift(bh); if(b.segments.length > b.size) b.segments.pop();
            ctx.fillStyle = b.color; b.segments.forEach(s => ctx.fillRect(s.x, s.y, 8, 8));
        });

        foods.forEach((f,i) => {
            ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x,f.y,4,0,Math.PI*2); ctx.fill();
            if(Math.hypot(player.segments[0].x-f.x, player.segments[0].y-f.y)<15) {
                player.size+=2; score+=10; foods[i]={x:Math.random()*800, y:Math.random()*500, c:f.c};
            }
        });

        ctx.fillStyle = player.color; player.segments.forEach(s => ctx.fillRect(s.x,s.y,10,10));
        updateLB();
    }

    function updateLB() {
        let list = [{n:"SEN", s:score}].concat(bots.filter(b=>b.alive).map(b=>({n:b.name, s:b.size*5}))).sort((a,b)=>b.s-a.s);
        document.getElementById('lb-list').innerHTML = list.slice(0,5).map(x=>`<div class="lb-row"><span>${x.n}</span><span>${x.s}</span></div>`).join('');
    }

    // --- TETRIS (STABİL) ---
    let board, piece, tetrominoes = {'I': [[1,1,1,1]], 'O': [[1,1],[1,1]], 'T': [[0,1,0],[1,1,1]], 'S': [[0,1,1],[1,1,0]], 'Z': [[1,1,0],[0,1,1]], 'J': [[1,0,0],[1,1,1]], 'L': [[0,0,1],[1,1,1]]};
    function initTetris() {
        canvas.width = 300; canvas.height = 500;
        ctx.setTransform(1,0,0,1,0,0); ctx.scale(25,25);
        board = Array.from({length: 20}, () => Array(12).fill(0));
        piece = { pos: {x: 4, y: 0}, matrix: tetrominoes['T'] };
        gameLoop = setInterval(() => { piece.pos.y++; if(collide()){piece.pos.y--; merge(); piece={pos:{x:4,y:0}, matrix:tetrominoes['IJLOSTZ'[Math.floor(Math.random()*7)]]}; if(collide()) die("Kule doldu!");} drawTetris(); }, 400);
    }
    function collide() { return piece.matrix.some((row, y) => row.some((v, x) => v !== 0 && (board[y + piece.pos.y] && board[y + piece.pos.y][x + piece.pos.x]) !== 0)); }
    function merge() { piece.matrix.forEach((row, y) => row.forEach((v, x) => { if(v) board[y+piece.pos.y][x+piece.pos.x]=1; })); board.forEach((row, y) => { if(row.every(v=>v!==0)) { board.splice(y,1); board.unshift(Array(12).fill(0)); score+=100; }}); }
    function drawTetris() { ctx.fillStyle='#000'; ctx.fillRect(0,0,12,20); board.forEach((row,y)=>row.forEach((v,x)=>{if(v){ctx.fillStyle='blue'; ctx.fillRect(x,y,1,1);}})); piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v){ctx.fillStyle='red'; ctx.fillRect(x+piece.pos.x,y+piece.pos.y,1,1);}})); }

    // --- PACMAN (GERÇEK LABİRENTLİ) ---
    let pac, ghosts, dots, walls;
    function initPacman() {
        canvas.width = 440; canvas.height = 440;
        pac = { x: 220, y: 330, dir: {x:0, y:0}, size: 12 };
        // Gerçekçi duvar yapısı
        walls = [
            {x:0,y:0,w:440,h:20}, {x:0,y:420,w:440,h:20}, {x:0,y:0,w:20,h:440}, {x:420,y:0,w:20,h:440},
            {x:60,y:60,w:100,h:40}, {x:280,y:60,w:100,h:40}, {x:60,y:140,w:100,h:20}, {x:280,y:140,w:100,h:20},
            {x:200,y:20,w:40,h:80}, {x:140,y:200,w:160,h:20}, {x:210,y:220,w:20,h:80},
            {x:60,y:280,w:60,h:80}, {x:320,y:280,w:60,h:80}
        ];
        dots = [];
        for(let i=0; i<50; i++) {
            let d = {x: Math.random()*380+30, y: Math.random()*380+30};
            if(!walls.some(w => d.x > w.x-5 && d.x < w.x+w.w+5 && d.y > w.y-5 && d.y < w.y+w.h+5)) dots.push(d);
        }
        ghosts = [{x: 220, y: 150, c: 'red', dx:2, dy:0}, {x: 50, y: 50, c: 'pink', dx:0, dy:2}];
        gameLoop = setInterval(updatePacman, 1000/60);
    }

    function updatePacman() {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,440,440);
        
        // Duvarları çiz
        ctx.fillStyle = '#2222ff';
        walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

        // Pacman Hareket ve Çarpışma
        let nextX = pac.x + pac.dir.x * 2.5;
        let nextY = pac.y + pac.dir.y * 2.5;
        
        let hit = walls.some(w => nextX+10 > w.x && nextX-10 < w.x+w.w && nextY+10 > w.y && nextY-10 < w.y+w.h);
        if(!hit) { pac.x = nextX; pac.y = nextY; }

        dots = dots.filter(d => {
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(d.x, d.y, 2, 0, Math.PI*2); ctx.fill();
            if(Math.hypot(pac.x-d.x, pac.y-d.y) < 12) { score+=10; return false; }
            return true;
        });

        ghosts.forEach(g => {
            let gx = g.x + g.dx; let gy = g.y + g.dy;
            if(walls.some(w => gx+10 > w.x && gx-10 < w.x+w.w && gy+10 > w.y && gy-10 < w.y+w.h)) {
                g.dx *= -1; g.dy *= -1; // Duvara çarpan hayalet geri döner
            } else { g.x = gx; g.y = gy; }
            
            ctx.fillStyle = g.c; ctx.beginPath(); ctx.arc(g.x, g.y, 12, 0, Math.PI, true); ctx.fill();
            if(Math.hypot(pac.x-g.x, pac.y-g.y) < 20) die("Yakalalandın!");
        });

        ctx.fillStyle = 'yellow'; ctx.beginPath(); ctx.arc(pac.x, pac.y, 14, 0.2*Math.PI, 1.8*Math.PI); ctx.lineTo(pac.x, pac.y); ctx.fill();
    }

    function die(r) { clearInterval(gameLoop); document.getElementById('death-reason').innerText = r; document.getElementById('game-over').style.display = 'flex'; }

    // --- KONTROLLER ---
    window.addEventListener('keydown', e => {
        if(activeGame === 'pacman') {
            if(e.key === 'ArrowLeft') pac.dir = {x:-1, y:0};
            if(e.key === 'ArrowRight') pac.dir = {x:1, y:0};
            if(e.key === 'ArrowUp') pac.dir = {x:0, y:-1};
            if(e.key === 'ArrowDown') pac.dir = {x:0, y:1};
        }
        if(activeGame === 'tetris') {
            if(e.key === 'ArrowLeft') { piece.pos.x--; if(collide()) piece.pos.x++; }
            if(e.key === 'ArrowRight') { piece.pos.x++; if(collide()) piece.pos.x--; }
            if(e.key === 'ArrowUp') { 
                let old = piece.matrix; piece.matrix = piece.matrix[0].map((_, i) => piece.matrix.map(row => row[i]).reverse());
                if(collide()) piece.matrix = old;
            }
        }
    });

    canvas.addEventListener('mousemove', e => {
        const r = canvas.getBoundingClientRect();
        mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    });

    // DERS SİSTEMİ (v2.1'den miras)
    const studyData = { "Matematik": [{t: "Limit", d: "Belirsizlik durumlarında çarpanlara ayır veya L'hopital kullan."}, {t: "Türev", d: "Eğim her şeydir."}, {t: "Polinom", d: "P(x) sorularında kökleri iyi analiz et."}], "Türkçe": [{t: "Paragraf", d: "Altı çizili söze dikkat!"}] };
    function renderCourses() {
        document.getElementById('study-title').innerText = "Ders Seç";
        let html = ''; for(let c in studyData) html += `<div class="course-btn" onclick="renderSubjects('${c}')">${c}</div>`;
        document.getElementById('course-list').innerHTML = html;
        document.getElementById('course-list').classList.remove('hidden');
    }
    function renderSubjects(c) {
        let html = ''; studyData[c].forEach(i => html += `<div class="subject-detail"><strong>${i.t}</strong><p>${i.d}</p></div>`);
        document.getElementById('study-body').innerHTML = `<div id="course-list" class="course-list"></div>` + html;
        document.getElementById('back-btn').classList.remove('hidden');
    }
</script>
</body>
</html>
