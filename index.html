<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benim Dünyam | v1.0.5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #0d0d1a; --blue: #1a1a40; --accent: #e94560; --green: #00ff41; --text: #e2e2e2; }
        body { font-family: 'Consolas', monospace; margin: 0; background-color: var(--dark); color: var(--text); overflow: hidden; }
        
        /* Üst Panel */
        header { background: #16213e; padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
        .version-group { display: flex; align-items: center; background: var(--accent); padding: 2px 10px; border-radius: 15px; gap: 5px; cursor: pointer; }

        /* Ana Konteyner */
        .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }

        /* OYUN ANA MENÜ (3 Butonlu Yapı) */
        .game-main-menu { display: flex; justify-content: center; align-items: center; gap: 30px; }
        .menu-btn { 
            width: 180px; height: 180px; background: var(--blue); border: 2px solid var(--accent); 
            border-radius: 20px; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .menu-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--accent); }
        .menu-btn i { font-size: 3rem; margin-bottom: 10px; }

        /* Oyun Sahnesi */
        #game-canvas-container { position: relative; display: none; flex-direction: column; align-items: center; }
        canvas { border: 5px solid #333; background: #000; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        /* HUD (Oyun içi bilgiler) */
        .hud { display: flex; justify-content: space-between; width: 400px; margin-bottom: 10px; color: var(--green); font-size: 1.2rem; }

        .hidden { display: none; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body>

<header>
    <div onclick="location.reload()" style="cursor:pointer;"><i class="fas fa-dragon"></i> BENİM DÜNYAM</div>
    <div class="nav-right">
        <div class="version-group" onclick="alert('v1.0.5: Oyun ana menüsü, Yılan Level Sistemi, Duvar Ölümü, Shift Hızı ve Veri Kaydetme eklendi.')">
            <span class="version">v1.0.5</span> <i class="fas fa-info-circle"></i>
        </div>
    </div>
</header>

<div class="container">
    <div id="main-menu" class="game-main-menu">
        <div class="menu-btn" onclick="openSettings()">
            <i class="fas fa-cog"></i><span>AYARLAR</span>
        </div>
        <div class="menu-btn" onclick="startSnakeGame()" style="background: var(--accent);">
            <i class="fas fa-play"></i><span>OYNA</span>
        </div>
        <div class="menu-btn" onclick="openSkins()">
            <i class="fas fa-user-ninja"></i><span>KARAKTER</span>
        </div>
    </div>

    <div id="game-canvas-container">
        <div class="hud">
            <span id="stat-level">Dünya: 1-1</span>
            <span id="stat-score">Puan: 0</span>
        </div>
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        <p style="color: #666; margin-top: 10px;">Yön: Ok Tuşları | Hız: Left Shift</p>
    </div>
</div>

<div id="game-over" class="overlay">
    <h1 style="color: var(--accent); font-size: 3rem;">ÖLDÜN!</h1>
    <p id="final-stats"></p>
    <button class="menu-btn" style="height: 60px; width: 200px;" onclick="location.reload()">TEKRAR DENE</button>
</div>

<script>
    // VERİ KAYDETME SİSTEMİ
    let userData = JSON.parse(localStorage.getItem('myWorldData')) || {
        level: 1,
        world: 1,
        totalPoints: 0,
        settings: { volume: 50, difficulty: 'normal' },
        skin: 'default'
    };

    function saveData() {
        localStorage.setItem('myWorldData', JSON.stringify(userData));
    }

    // YILAN OYUNU DEĞİŞKENLERİ
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");
    let box = 20;
    let snake = [{ x: 10 * box, y: 10 * box }];
    let food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
    let dir;
    let score = 0;
    let baseSpeed = 150;
    let shiftSpeed = 60;
    let currentSpeed = baseSpeed;
    let gameLoop;

    // Shift Kontrolü
    document.addEventListener("keydown", e => {
        if(e.code === "ShiftLeft") currentSpeed = shiftSpeed;
        if(e.keyCode == 37 && dir != "RIGHT") dir = "LEFT";
        if(e.keyCode == 38 && dir != "DOWN") dir = "UP";
        if(e.keyCode == 39 && dir != "LEFT") dir = "RIGHT";
        if(e.keyCode == 40 && dir != "UP") dir = "DOWN";
    });
    document.addEventListener("keyup", e => {
        if(e.code === "ShiftLeft") currentSpeed = baseSpeed;
    });

    function startSnakeGame() {
        document.getElementById("main-menu").classList.add("hidden");
        document.getElementById("game-canvas-container").style.display = "flex";
        runGame();
    }

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? varColor() : "white";
            ctx.fillRect(snake[i].x, snake[i].y, box - 2, box - 2);
        }

        ctx.fillStyle = "red";
        ctx.fillRect(food.x, food.y, box - 2, box - 2);

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if (dir == "LEFT") snakeX -= box;
        if (dir == "UP") snakeY -= box;
        if (dir == "RIGHT") snakeX += box;
        if (dir == "DOWN") snakeY += box;

        // DUVARA ÇARPMA KONTROLÜ
        if (snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
            gameOver();
            return;
        }

        let newHead = { x: snakeX, y: snakeY };

        if (snakeX == food.x && snakeY == food.y) {
            score++;
            document.getElementById("stat-score").innerText = "Puan: " + score;
            food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
            checkLevelUp();
        } else {
            snake.pop();
        }

        if (collision(newHead, snake)) {
            gameOver();
            return;
        }

        snake.unshift(newHead);
    }

    function collision(head, array) {
        for (let i = 0; i < array.length; i++) {
            if (head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    function checkLevelUp() {
        let levelThreshold = userData.world * 10; 
        if(score >= levelThreshold) {
            userData.level++;
            if(userData.level > 10) {
                userData.world++;
                userData.level = 1;
            }
            saveData();
            document.getElementById("stat-level").innerText = `Dünya: ${userData.world}-${userData.level}`;
            alert(`TEBRİKLER! Dünya ${userData.world} seviyesine geçtin!`);
        }
    }

    function gameOver() {
        clearInterval(gameLoop);
        document.getElementById("game-over").style.display = "flex";
        document.getElementById("final-stats").innerText = `Dünya: ${userData.world} | Puan: ${score}`;
    }

    function runGame() {
        clearInterval(gameLoop);
        draw();
        gameLoop = setTimeout(runGame, currentSpeed);
    }

    function varColor() {
        return userData.skin === 'gold' ? 'gold' : '#00ff41';
    }

    // MENÜ FONKSİYONLARI
    function openSettings() {
        let newVol = prompt("Ses Seviyesi (0-100):", userData.settings.volume);
        if(newVol) { userData.settings.volume = newVol; saveData(); }
    }

    function openSkins() {
        let choice = confirm("Altın Skin kullanmak ister misin?");
        userData.skin = choice ? 'gold' : 'default';
        saveData();
        alert("Karakter güncellendi!");
    }
</script>
</body>
</html>
